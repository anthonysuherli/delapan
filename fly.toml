app = "delapan-cloud-mcp"
primary_region = "sjc"

[build]

[env]
  DELAPAN_BACKEND = "cloud"
  PORT = "8000"
  CLOUD_SERVER_URL = "https://delapan-cloud-mcp.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
