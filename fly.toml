# fly.toml app configuration file generated for delapan-cloud-mcp on 2026-07-17T22:16:36-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'delapan-cloud-mcp'
primary_region = 'sjc'

[build]
[env]
  CLOUD_SERVER_URL = 'https://delapan-cloud-mcp.fly.dev'
  DELAPAN_BACKEND = 'cloud'
  DLP_API__AUTH = 'supabase'
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
