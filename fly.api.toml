# Open-core /api REST surface (delapan.api.main) — backs the delapan-fe dashboard.
# Reuses the repo Dockerfile image; [processes] overrides its CMD (which runs the
# MCP server) with uvicorn serving the FastAPI app instead.
#   fly deploy --config fly.api.toml
app = 'delapan-api'
primary_region = 'sjc'

[build]

[env]
  DELAPAN_BACKEND = 'cloud'
  DLP_API__AUTH = 'supabase'
  PORT = '8000'
  CORS_ORIGINS = 'https://delapan.ai'

[processes]
  app = 'uvicorn delapan.api.main:app --host 0.0.0.0 --port 8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
