- id: q-f33d3ff44f284d188cdbcbb0dca52364
  question: What types of changes are permitted to be cherry-picked into vLLM release branches?
  reference_answer: The allowed cherry-pick changes for vLLM release branches include regression fixes,
    critical fixes covering issues like silent incorrectness, crashes, deadlocks, and memory leaks, fixes
    to new features introduced in a recent release, documentation improvements, and release branch specific
    changes. Feature work is explicitly prohibited, and all pull requests must be merged into the main
    trunk before being cherry-picked, with the exception of release branch specific changes.
  gold_finding_ids:
  - f33d3ff44f284d188cdbcbb0dca52364
  type: single-hop
- id: q-0e0ecfc292b243e4bff63c913fb64655
  question: In the vLLM release process, what happens when the final version tag (e.g., vX.Y.Z) is pushed
    — does it trigger a build?
  reference_answer: No, pushing the final vX.Y.Z tag does not trigger a build. It is only used for publishing
    release notes and attaching release assets. The actual build is triggered by pushing an RC tag such
    as vX.Y.Z-rc1.
  gold_finding_ids:
  - 0e0ecfc292b243e4bff63c913fb64655
  type: single-hop
