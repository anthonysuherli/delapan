  question: How do I create a connection to Microsoft SQL Server?
  reference_answer: 'To create a connection to Microsoft SQL Server, you will need the following connection
    details: the database name, hostname or IP address, either the port number or the instance name, username
    and password, and the SSL certificate (if required by the database server). Additionally, if the server
    is configured for dynamic ports, you should use the instance name. If the Microsoft SQL Server has
    been set up in a domain that uses NTLM (New Technology LAN Manager) authentication, you should select
    the "Use Active Directory" option and enter the name of the domain that is associated with the username
    and password. Finally, for private connectivity, you will need to set up a secure connection if the
    database is not externalized to the internet (for example, behind a firewall).'
