  question: What is the purpose of the Sim Eval node in IBM SPSS Modeler?
  reference_answer: The Sim Eval node is a terminal node that evaluates a specified field, provides a
    distribution of the field, and produces charts of distributions and correlations. It is primarily
    used to evaluate continuous fields and is designed to be used with data that was obtained from the
    Sim Fit and Sim Gen nodes.
