  question: What is the difference between the Symmetric Mean Absolute Percentage Error (SMAPE) and the
    Root Mean Squared Error (RMSE) metrics?
  reference_answer: The Symmetric Mean Absolute Percentage Error (SMAPE) metric is calculated by dividing
    the absolute difference between the actual value and the predicted value by half the sum of the absolute
    actual value and the predicted value, and then averaging the result across all fitted points. The
    Root Mean Squared Error (RMSE) metric is calculated by taking the square root of the mean of the squared
    differences between the actual values and the predicted values.
