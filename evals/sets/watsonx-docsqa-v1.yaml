  question: What is the workflow for a Federated Learning experiment?
  reference_answer: 'The workflow for a Federated Learning experiment involves three main roles: the data
    scientist, the party, and the admin. The data scientist identifies the data sources, creates an initial
    "untrained" model, and creates a data handler file. The party connects to the aggregator on their
    system, which can be remote. The admin controls the Federated Learning experiment by configuring the
    experiment to accommodate remote parties and starting the aggregator.'
