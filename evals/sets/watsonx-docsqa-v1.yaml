  question: What are the different methods for tuning foundation models?
  reference_answer: 'Foundation models can be tuned in two ways: fine-tuning and prompt-tuning. Fine-tuning
    changes the parameters of the underlying foundation model to guide the model to generate output that
    is optimized for a task. Prompt-tuning adjusts the content of the prompt that is passed to the model
    to guide the model to generate output that matches a pattern you specify. The underlying foundation
    model and its parameters are not edited. Only the prompt input is altered.'
