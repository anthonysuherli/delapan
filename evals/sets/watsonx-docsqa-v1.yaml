  question: What is the retrieval-augmented generation pattern?
  reference_answer: 'The retrieval-augmented generation pattern is a technique for generating factually
    accurate output based on information in a knowledge base. It involves three basic steps: searching
    for relevant content in the knowledge base, pulling the most relevant content into the prompt as context,
    and sending the combined prompt text to the model to generate output.'
