  question: How can I export the data from a Data Refinery flow to a CSV file?
  reference_answer: To export the data from a Data Refinery flow to a CSV file, click the Export icon
    on the toolbar. This will create a CSV file that is downloaded to your computer's Downloads folder
    (or the user-specified download location) at the current step in the Data Refinery flow. If you are
    in snapshot view, the output of the CSV file will be at the step that you clicked. If you are viewing
    a sample (subset) of the data, only the sample data will be in the output.
