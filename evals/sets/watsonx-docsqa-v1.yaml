  - ca454414f5779063fb77e39475708124
  - 2e820c1806dcd84b9b1ab9ab45bdafbb
  type: single-hop
- id: test_2
  question: What is greedy decoding?
  reference_answer: Greedy decoding produces output that closely matches the most common language in the
    model's pretraining data and in your prompt text, which is desirable in less creative or fact-based
    use cases. A weakness of greedy decoding is that it can cause repetitive loops in the generated output.
