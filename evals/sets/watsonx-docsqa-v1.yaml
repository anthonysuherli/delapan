  question: What are the benefits of using scripting in SPSS Modeler?
  reference_answer: Scripting in SPSS Modeler can be used to automate repetitive tasks, impose a specific
    order for node executions in a flow, set properties for a node, and perform derivations using a subset
    of CLEM. Additionally, scripting can be used to specify an automatic sequence of actions that normally
    involves user interaction, such as building a model and then testing it.
