  question: How do you save a Data Refinery flow?
  reference_answer: To save a Data Refinery flow, click the Save Data Refinery flow icon in the Data Refinery
    toolbar. The default output of the Data Refinery flow is saved as a data asset with the name source-file-name_shaped.csv.
    For example, if the source file is mydata.csv, the default name and output for the Data Refinery flow
    is mydata_csv_shaped. You can edit the name and add an extension by changing the target of the Data
    Refinery flow.
