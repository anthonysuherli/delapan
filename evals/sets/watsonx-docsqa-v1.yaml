  question: What is a Jupyter notebook?
  reference_answer: A Jupyter notebook is a web-based environment for interactive computing. It allows
    you to run small pieces of code that process your data, and immediately view the results of your computation.
    Notebooks include all of the building blocks you need to work with data, including the data itself,
    the code computations that process the data, visualizations of the results, and text and rich media
    to enhance understanding.
