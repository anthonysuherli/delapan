  question: What are the key functions of the geospatial library?
  reference_answer: The geospatial library includes functions to read and write data, topological functions,
    geohashing, indexing, ellipsoidal and routing functions. All calculated geometries are accurate without
    the need for projections, and the geospatial functions take advantage of the distributed processing
    capabilities provided by Spark. The library also includes native geohashing support for geometries
    used in simple aggregations and in indexing, thereby improving storage retrieval considerably. Additionally,
    the library supports extensions of Spark distributed joins and the SQL/MM extensions to Spark SQL.
  gold_finding_ids:
