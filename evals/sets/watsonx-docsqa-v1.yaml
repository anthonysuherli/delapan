  question: What are parameters in CLEM?
  reference_answer: Parameters are user-defined variables that are saved and persisted with the current
    flow or SuperNode and can be accessed from the user interface as well as through scripting. They are
    often used in scripting to control the behavior of the script, by providing information about fields
    and values that don't need to be hard coded in the script.
