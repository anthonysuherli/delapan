  question: What is Watson OpenScale?
  reference_answer: Watson OpenScale is a tool that helps organizations evaluate and monitor the performance
    of their AI models. It tracks and measures outcomes from AI models, and helps ensure that they remain
    fair, explainable, and compliant no matter where the models were built or are running. Watson OpenScale
    also detects and helps correct the drift in accuracy when an AI model is in production.
