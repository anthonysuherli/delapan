  question: What are the properties of the Bayes Net node in the Clementine data mining tool?
  reference_answer: The Bayes Net node in the Clementine data mining tool has several properties, including
    the ability to build a probability model by combining observed and recorded evidence with real-world
    knowledge, the ability to focus on Tree Augmented Naïve Bayes (TAN) and Markov Blanket networks, and
    the ability to use a single target field and one or more input fields. Additionally, the node can
    be used for classification and can be trained using existing models. The node also allows for feature
    selection and the use of different methods for estimating conditional probability tables and determining
    independence. The significance level and maximal conditioning set can also be specified. Finally,
    the node allows for the selection of specific fields from the dataset to be always used when building
    the Bayesian network.
