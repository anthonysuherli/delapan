  question: What is an Analysis node in SPSS modeler?
  reference_answer: An Analysis node is a node in a predictive model that allows you to evaluate the ability
    of the model to generate accurate predictions. It performs various comparisons between predicted values
    and actual values (your target field) for one or more model nuggets. You can also use Analysis nodes
    to compare predictive models to other predictive models.
