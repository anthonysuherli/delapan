  question: What are the four main areas of Watson OpenScale?
  reference_answer: The four main areas of Watson OpenScale are Insights, Explain a transaction, Configuration,
    and Support. Insights displays the models that you are monitoring and provides status on the results
    of model evaluations. Explain a transaction describes how the model determined a prediction. Configuration
    can be used to select a database, set up a machine learning provider, and optionally add integrated
    services. Support provides you with resources to get the help you need with Watson OpenScale.
