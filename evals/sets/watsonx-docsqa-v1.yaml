  question: What are the different types of joins that can be performed in Data Refinery?
  reference_answer: There are several types of joins that can be performed in Data Refinery, including
    left join, right join, inner join, full join, semi join, and anti join. Each type of join has a specific
    purpose and can be used to combine data from two data sets based on a comparison of the values in
    specified key columns.
