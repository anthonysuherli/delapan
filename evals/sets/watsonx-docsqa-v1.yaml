  question: How do you edit, duplicate, insert, or delete a step in Data Refinery?
  reference_answer: 'In the Steps pane, click the overflow menu on the step for the operation that you
    want to change. Select the action (Edit, Duplicate, Insert step before, Insert step after, or Delete).
    If you select Edit, Data Refinery goes into edit mode and either displays the operation to be edited
    on the command line or in the Operation pane. Apply the edited operation. If you select Duplicate,
    the duplicated step is inserted after the selected step. Note: The Duplicate action is not available
    for the Join or Union operations. Data Refinery updates the Data Refinery flow to reflect the changes
    and reruns all the operations.'
