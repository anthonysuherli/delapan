  question: What is the difference between traditional AI models and foundation models?
  reference_answer: Traditional AI models are trained on large, structured, well-labeled data sets that
    encompass a specific task, and can be used for a single task. Foundation models are trained on large,
    diverse, unlabeled data sets and can be used for many different tasks.
