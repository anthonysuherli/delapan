  question: What is a candlestick chart?
  reference_answer: A candlestick chart is a type of financial chart that is used to describe price movements
    of a security, derivative, or currency. It typically shows one day of data and is most often used
    in the analysis of equity and currency price patterns. The data set that is used to create a candlestick
    chart must contain open, high, low, and close values for each time period you want to display.
  gold_finding_ids:
