  question: What is the purpose of the Feature Selection node?
  reference_answer: "The Feature Selection node is used to identify the most important fields for a given\
    \ analysis. It consists of three steps: screening, ranking, and selecting. Screening removes unimportant\
    \ and problematic inputs and records, or cases such as input fields with too many missing values or\
    \ with too much or too little variation to be useful. Ranking sorts remaining inputs and assigns ranks\
    \ based on importance. Selecting identifies the subset of features to use in subsequent modelsâ\x80\
    \x94for example, by preserving only the most important inputs and filtering or excluding all others."
  gold_finding_ids:
