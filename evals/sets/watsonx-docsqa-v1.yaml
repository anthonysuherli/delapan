  question: What are the benefits of using IBM Federated Learning?
  reference_answer: IBM Federated Learning enables sites with large volumes of data to be collected, cleaned,
    and trained on an enterprise scale without migration. It also accommodates for the differences in
    data format, quality, and constraints, and complies with data privacy and security while training
    models with different data sources.
