# Mirror docs/tracking → Supabase whenever tracking source changes.
# Secrets required: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY

name: tracking-sync

on:
  push:
    paths:
      - "docs/tracking/**"
      - "scripts/tracking_sync.py"
      - "delapan/tracking/**"
      - ".github/workflows/tracking-sync.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install package
        run: uv sync --extra cloud

      - name: Sync tracking → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: uv run python scripts/tracking_sync.py
