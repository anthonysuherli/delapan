[project]
name = "delapan"
version = "0.1.0"
description = "Open-core grounding engine: ground -> grow -> answer. Local SQLite, MCP-native."
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "pydantic>=2.12.5",
  "pydantic-settings>=2.12.0",
  "pyyaml>=6.0.3",
  "httpx>=0.28.1",
  "fastapi>=0.122.0",
  "uvicorn[standard]>=0.38.0",
  "anthropic>=0.104.1",
  "langchain-core>=1.4.0",
  "langchain-anthropic>=1.4.3",
  "openai>=2.30.0",
  "tavily-python>=0.7.23",
  "mcp>=1.16.0",
  "jinja2>=3.1.4",
]

[project.optional-dependencies]
local = ["sqlite-vec>=0.1.6"]
cloud = [
  "supabase>=2.28.3",
  "asyncpg>=0.31.0",
  "pyjwt[crypto]>=2.10.1",
  "argon2-cffi>=25.1.0",
  "slowapi>=0.1.9",
]
dev = ["pytest>=8.4.2", "pytest-asyncio>=1.3.0", "ruff>=0.12.0", "pyright>=1.1.409"]
evals = ["pyyaml>=6.0", "tiktoken>=0.8"]
evals-hhem = ["transformers>=4.44", "torch>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["delapan", "evals"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
